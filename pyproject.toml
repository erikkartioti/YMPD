[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ympd"
version = "0.1.0"
description = "Скачивает плейлист Яндекс Музыки в lossless через Soulseek (slskd)"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
dependencies = ["slskd-api", "yandex-music", "python-dotenv"]

[project.optional-dependencies]
dev = ["pytest", "ruff"]

[project.scripts]
ympd = "ympd.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
